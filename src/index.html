<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/">

  <!-- Balises SEO par défaut : SeoService les mettra à jour à chaque page -->
  <title>MarketSpace – Mode de seconde main au Cameroun</title>
  <meta name="description" content="Achetez et vendez des vêtements, chaussures et accessoires de seconde main à Douala, Yaoundé, Bafoussam, Garoua et partout au Cameroun. Prix en FCFA.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.marketspace.cm/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MarketSpace">
  <meta property="og:locale" content="fr_CM">
  <meta property="og:title" content="MarketSpace – Mode de seconde main au Cameroun">
  <meta property="og:description" content="La marketplace camerounaise de la mode de seconde main : pagne wax, toghu, baskets, sacs et accessoires.">
  <meta property="og:url" content="https://www.marketspace.cm/">
  <meta property="og:image" content="https://www.marketspace.cm/assets/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo MarketSpace et trois articles de mode de seconde main">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MarketSpace – Mode de seconde main au Cameroun">
  <meta name="twitter:description" content="La marketplace camerounaise de la mode de seconde main.">
  <meta name="twitter:image" content="https://www.marketspace.cm/assets/img/og-image.jpg">

  <meta name="theme-color" content="#057255" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <!-- Applique le thème avant le premier rendu (évite le flash blanc) -->
  <script>
    (function () {
      var theme = null;
      try { theme = JSON.parse(window.localStorage.getItem('marketspace.theme')); } catch (e) { theme = null; }
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <!-- Image principale de l'accueil chargée en priorité -->
  <link rel="preload" as="image" href="assets/img/hero/hero-1200.webp" type="image/webp"
        imagesrcset="assets/img/hero/hero-600.webp 600w, assets/img/hero/hero-1200.webp 1200w"
        imagesizes="(min-width: 992px) 50vw, 100vw" fetchpriority="high">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">

  <!-- Données structurées par défaut (remplacées dynamiquement par SeoService) -->
  <script type="application/ld+json" id="ld-json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://www.marketspace.cm/#organization",
        "name": "MarketSpace",
        "url": "https://www.marketspace.cm/",
        "logo": "https://www.marketspace.cm/assets/icons/icon-512.png",
        "areaServed": "CM"
      },
      {
        "@type": "WebSite",
        "@id": "https://www.marketspace.cm/#website",
        "name": "MarketSpace",
        "url": "https://www.marketspace.cm/",
        "inLanguage": "fr-CM",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.marketspace.cm/catalogue?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    ]
  }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
